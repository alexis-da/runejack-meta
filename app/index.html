<title>Runejack Méta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: neutral dark app — top bar with tabs, then one view per tab (tier list rows that unfold, sortable tables, cards). */
:root {
  color-scheme: dark;
  --bg: #0f1115; --felt: #171a21; --felt-2: #1e222a; --deep: #14171d; --line: #262a33; --line-2: #3a3f4a;
  --text: #eceef1; --soft: #c9ced6; --muted: #9aa1ad; --gold: #f2c14e; --gold-dim: #8a6d1f; --keyc: #8faea2;
  --tier-s: #ff8a6b; --tier-a: #f2b84b; --tier-b: #7cc995; --tier-c: #7db8ea; --tier-d: #b7bbc2;
  --f-noblesse: #e3c15a; --f-ombre: #9b7be0; --f-sang: #e0524f; --f-mort: #a9c2b6; --f-arcane: #4fb0e8; --f-or: #f08a3c;
  --good: #7dd3a0; --bad: #e0524f; --warn: #f2b84b; --contra: #c58cf0;
  --display: "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: 21px; line-height: 1.2; color: var(--gold); }
h2 { font-size: 22px; line-height: 1.2; }
h3 { font-size: 17px; line-height: 1.25; }
p { margin: 0; max-width: 72ch; }
.muted { color: var(--muted); }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-bottom: 12px; }
header.top #sub { flex: 1 1 100%; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.chip b { color: var(--text); font-weight: 500; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); }
nav.tabs button { font-family: var(--body); font-size: 14px; line-height: 1; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover { color: var(--text); }
nav.tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--gold); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
section.view { display: grid; gap: 20px; padding-top: 22px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 6px 12px; font-size: 14px; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: #2a2413; color: var(--gold); font-weight: 600; }
input[type="search"], select { background: var(--felt); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; }

.comp { display: grid; grid-template-columns: 60px minmax(0, 1fr); background: var(--felt); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tier { display: grid; place-items: center; font-family: var(--display); font-size: 48px; color: var(--bg); }
.tier.S { background: var(--tier-s); } .tier.A { background: var(--tier-a); } .tier.B { background: var(--tier-b); } .tier.C { background: var(--tier-c); } .tier.D { background: var(--tier-d); }
.comp-body { padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.comp-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.tag { font-family: var(--mono); font-size: 12px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--gold-dim); color: var(--gold); }
.tag.grey { border-color: var(--line); color: var(--muted); }
.fams { display: flex; flex-wrap: wrap; gap: 6px; }
.fam { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 2px 7px; color: var(--bg); }
.fam.noblesse, .hex.noblesse, .dot.noblesse { background: var(--f-noblesse); } .fam.ombre, .hex.ombre, .dot.ombre { background: var(--f-ombre); } .fam.sang, .hex.sang, .dot.sang { background: var(--f-sang); }
.fam.mort, .hex.mort, .dot.mort { background: var(--f-mort); } .fam.arcane, .hex.arcane, .dot.arcane { background: var(--f-arcane); } .fam.or, .hex.or, .dot.or { background: var(--f-or); }
.scroll { overflow-x: auto; }
.board { display: grid; grid-template-columns: repeat(5, minmax(118px, 1fr)); gap: 10px; min-width: 610px; }
.seat { display: grid; justify-items: center; align-content: start; gap: 5px; text-align: center; padding: 10px 6px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 45%, transparent); }
.sn { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.seat.carry { box-shadow: inset 0 0 0 2px var(--gold); }
.carry-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; border-radius: 3px; padding: 0 4px; background: var(--gold); color: var(--bg); }
.carry-line { font-size: 14px; margin: -2px 0 0; }
.carry-line b { color: var(--gold); }
.carry-line b.key { color: var(--f-mort); }
.key-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; border-radius: 3px; padding: 0 4px; background: var(--f-mort); color: var(--bg); }
.seat.key { box-shadow: inset 0 0 0 2px var(--f-mort); }
.dmg { font-family: var(--mono); font-size: 11px; color: var(--muted); }
ol.floors { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
ol.floors > li { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--felt); }
.fl-num { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.fl-num b { font-size: 15px; line-height: 1.2; color: var(--gold); font-weight: 700; }
.fl-num span { font-size: 12px; color: var(--muted); }
.hchip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; margin: 2px 6px 2px 0; }
.hchip .muted { font-size: 12px; }

.hex { width: 52px; height: 58px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center; font-family: var(--display); font-size: 24px; color: var(--bg); }
.hex.sm { width: 30px; height: 34px; font-size: 15px; flex: none; }
.hname { font-weight: 600; font-size: 14px; line-height: 1.1; }
.stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; line-height: 1; }
.items { display: grid; gap: 3px; width: 100%; }
.item { font-size: 11.5px; line-height: 1.2; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; background: var(--felt-2); }
.item.contra { border-color: var(--contra); color: var(--contra); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; }
.stat { display: grid; gap: 1px; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
details { border-top: 1px solid var(--line); padding-top: 10px; }
details summary { cursor: pointer; color: var(--gold); font-size: 14px; }
details[open] summary { margin-bottom: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
ul.tips { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
ul.tips b { color: var(--gold); font-weight: 600; }
.card { background: var(--felt); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; background: var(--felt); white-space: nowrap; }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--text); }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--felt); }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-family: var(--mono); font-size: 12px; border-radius: 4px; padding: 1px 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
.who { display: flex; gap: 8px; align-items: center; }
.minibar { height: 6px; border-radius: 3px; background: var(--gold); min-width: 2px; }
.track { background: var(--felt-2); border-radius: 3px; width: 120px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
ol.steps > li { counter-increment: step; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 14px; background: var(--felt); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
ol.steps > li::before { content: counter(step); font-family: var(--mono); font-size: 32px; font-weight: 600; color: var(--gold); line-height: 1; }
dialog { background: var(--felt); color: var(--text); border: 1px solid var(--line); border-radius: 14px; max-width: min(720px, 92vw); padding: 20px; }
dialog::backdrop { background: rgb(0 0 0 / .6); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
pre.notes { white-space: pre-wrap; font-family: var(--body); font-size: 14px; margin: 0; max-height: 420px; overflow: auto; }
/* pictures from the game (pixel art) */
img.px { image-rendering: pixelated; display: block; }
ul.tips img.px, .who img.px { display: inline-block; vertical-align: middle; }
.tile { flex: none; width: 56px; height: 56px; border-radius: 8px; border: 2px solid var(--line-2); background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.tile img { width: 100%; height: 100%; }
.tile.sm { width: 44px; height: 44px; border-radius: 7px; }
.tile.xs { width: 28px; height: 28px; border-radius: 5px; }
.tile.r1 { border-color: #9aa1ad; } .tile.r2 { border-color: #7dd3a0; } .tile.r3 { border-color: #5aa9e6; } .tile.r4 { border-color: #b58cf0; } .tile.r5 { border-color: #f2c14e; }
.tile.carry { box-shadow: 0 0 0 2px var(--felt), 0 0 0 4px var(--gold); }
.tile.key { box-shadow: 0 0 0 2px var(--felt), 0 0 0 4px var(--keyc); }
.tile .ini { font-weight: 700; font-size: 13px; color: var(--muted); }
.icon { width: 18px; height: 18px; border-radius: 3px; background: var(--felt-2); }
.icon.md { width: 24px; height: 24px; border-radius: 4px; }
.icon.lg { width: 32px; height: 32px; border-radius: 6px; padding: 2px; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 62px; }
.unit .st { color: var(--gold); font-size: 11px; letter-spacing: 1px; line-height: 1; min-height: 11px; }
.unit .its { display: flex; gap: 1px; min-height: 18px; }
.unit .n { font-size: 11.5px; color: var(--soft); text-align: center; line-height: 1.2; }
.ctabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: -18px -16px 0; padding: 0 16px; background: var(--deep); }
.ctabs button { font: inherit; font-size: 14px; padding: 10px 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
.ctabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--gold); }
.cpanel[hidden] { display: none; }
.brow { display: flex; align-items: center; gap: 16px; padding: 8px 12px; border-radius: 10px; background: var(--felt); }
.brow .lbl { width: 92px; flex: none; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: var(--felt-2); text-align: center; }
.brow .us { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.brow .res { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.brow .res b { font-family: var(--mono); font-size: 16px; }
.brow .res span { font-size: 12px; color: var(--muted); }
.itrow { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.rlist { display: flex; flex-wrap: wrap; gap: 8px; }
.rchip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 10px; background: var(--felt); font-size: 13.5px; }
.rchip .k { font-family: var(--mono); font-size: 12px; color: var(--muted); }
/* tier list: one row per comp, unfolds into the detail */
.clist { display: grid; gap: 8px; }
.chead, .crow > summary { display: grid; grid-template-columns: 44px minmax(190px, 250px) minmax(0, 1fr) 96px 84px 34px; gap: 16px; align-items: center; }
.chead { padding: 0 16px; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.crow { background: var(--felt); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.crow[open] { border-color: var(--line-2); }
.crow { padding: 0; }
.crow > summary { list-style: none; cursor: pointer; padding: 14px 16px; color: var(--text); font-size: 15px; }
.crow[open] > summary { margin-bottom: 0; }
.crow > summary::-webkit-details-marker { display: none; }
.crow > summary:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.tbadge { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: var(--bg); }
.tbadge.S { background: var(--tier-s); } .tbadge.A { background: var(--tier-a); } .tbadge.B { background: var(--tier-b); } .tbadge.C { background: var(--tier-c); } .tbadge.D { background: var(--tier-d); }
.cname { display: grid; gap: 3px; min-width: 0; }
.cname b { font-size: 15px; font-weight: 600; }
.cname small { font-size: 13px; color: var(--muted); }
.cname small em { font-style: normal; color: var(--gold); }
.cname .mob { display: none; }
.team { display: flex; gap: 6px; }
.av { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; }
.dot { flex: none; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--bg); }
.dot.sm { width: 24px; height: 24px; font-size: 10.5px; }
.fam { white-space: nowrap; }
.av.carry .dot { box-shadow: 0 0 0 3px var(--felt), 0 0 0 5px var(--gold); }
.av.key .dot { box-shadow: 0 0 0 3px var(--felt), 0 0 0 5px var(--keyc); }
.av .n { font-size: 11.5px; color: var(--soft); text-align: center; line-height: 1.2; }
.num { font-family: var(--mono); font-size: 17px; font-weight: 600; }
.num.win { color: var(--good); }
.chev { width: 34px; height: 34px; border: 1px solid #2e333d; border-radius: 8px; background: var(--felt-2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text); }
.chev::after { content: "+"; }
.crow[open] .chev::after { content: "−"; }
.cbody { border-top: 1px solid var(--line); background: var(--deep); padding: 18px 16px 20px; display: grid; gap: 20px; }
.cbody .stats { padding: 12px; border-radius: 10px; background: var(--felt); }
.hgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.hcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--felt); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hcard.carry { border-color: var(--gold-dim); }
.hcard.key { border-color: #4a5a54; }
.hcard .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.hcard .top b { font-size: 14px; }
.hcard .st { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
.hcard .d { font-size: 12px; color: var(--muted); }
.it { font-size: 12.5px; background: var(--felt-2); border-radius: 5px; padding: 3px 7px; }
.sect h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: .04em; text-transform: uppercase; }
.legend { font-size: 13px; color: var(--muted); }
@media (max-width: 860px) {
  .chead { display: none; }
  .crow > summary { grid-template-columns: 40px minmax(0, 1fr) 34px; gap: 12px; }
  .crow > summary .team { grid-column: 1 / -1; order: 5; justify-content: space-between; }
  .unit { width: 60px; } .tile { width: 48px; height: 48px; }
  .brow { flex-wrap: wrap; justify-content: space-between; } .brow .us { order: 3; flex: 1 1 100%; justify-content: flex-start; gap: 4px; } .brow .us .unit { width: 54px; }
  .crow > summary .num { display: none; }
  .cname .mob { display: block; }
  .hgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .av { width: 58px; }
}
@media (max-width: 560px) { .comp { grid-template-columns: 40px minmax(0, 1fr); } .tier { font-size: 34px; } ol.steps > li { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Runejack Méta</h1>
    <p class="muted" id="sub">Compos, héros, objets, runes et stratégie, mesurés avec le simulateur du banc d’essai du jeu et mis à jour à chaque patch.</p>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  <main id="view"><div class="empty">Chargement des données…</div></main>
  <footer id="foot"></footer>
</div>
<dialog id="dlg"><div id="dlg-body"></div><p style="margin-top:14px"><button id="dlg-close" style="all:unset;cursor:pointer;color:var(--gold)">Fermer</button></p></dialog>

<script>
const TABS = [['compos', 'Compos'], ['strategie', 'Stratégie'], ['heros', 'Héros'], ['objets', 'Objets'], ['runes', 'Runes'], ['benedictions', 'Bénédictions'], ['contrebande', 'Contrebandier'], ['boss', 'Boss'], ['joueurs', 'Vraies parties'], ['patch', 'Patch']];
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const big = (x) => (x >= 1e9 ? `${(x / 1e9).toLocaleString('fr-FR', { maximumFractionDigits: 2 })} Md` : x >= 1e6 ? `${(x / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 2 })} M` : nf.format(Math.round(x)));
const pct = (x, d = 0) => `${(x * 100).toLocaleString('fr-FR', { maximumFractionDigits: d })} %`;
const sgn = (x) => `${x >= 0 ? '+' : ''}${pct(x)}`;
const pillPct = (x) => `<span class="pill ${x < 0.4 ? 'bad' : x < 0.75 ? 'warn' : 'good'}">${pct(x)}</span>`;
let M, S, H, IT, RU, BL, BO, FAM;
const hero = (id) => H.get(id) ?? { name: id, families: ['?'] };
// real games (API): rates are given in percent by the API
let RH = new Map(), RI = new Map(), RR = new Map(), RB = new Map();
function realMaps() {
  if (!S?.ok) return;
  const r = S.routes;
  if (Array.isArray(r.heros)) RH = new Map(r.heros.map((x) => [x.id, x]));
  if (r.objets?.objets) RI = new Map([...r.objets.objets, ...(r.objets.emblemes ?? [])].map((x) => [x.id, x]));
  if (Array.isArray(r.runes)) RR = new Map(r.runes.map((x) => [x.id ?? x.nom, x]));
  if (r.benedictions?.benedictions) RB = new Map(r.benedictions.benedictions.map((x) => [x.id, x]));
}
const rate = (x) => (x == null ? '–' : `${Number(x).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} %`);
const realCell = (x) => (x ? `<span title="${x.runs} runs">${rate(x.tauxVictoire)}</span> <span class="muted" style="font-size:12px">(${x.runs})</span>` : '<span class="muted">–</span>');
const itemName = (id) => IT.get(id)?.name ?? id;

async function load() {
  try {
    const r = await fetch('data.json', { cache: 'no-store' });
    const d = await r.json();
    M = d.meta; S = d.stats;
  } catch (e) {
    $('#view').innerHTML = `<div class="empty">Données introuvables (data.json). ${esc(e.message)}</div>`;
    return;
  }
  H = new Map(M.heroes.map((h) => [h.id, h])); IT = new Map(M.items.map((i) => [i.id, i])); RU = new Map(M.runes.map((r) => [r.id, r]));
  BL = new Map(M.blessings.map((b) => [b.id, b])); BO = new Map(M.bosses.map((b) => [b.id, b])); FAM = new Map(M.traits.map((t) => [t.id, t]));
  realMaps();
  const final = M.hp?.[1]?.find((e) => e.etage === M.settings.floors);
  $('#chips').innerHTML = [`version <b>${esc(M.version)}</b>${M.versionDate ? ` · ${esc(M.versionDate)}` : ''}`, `${esc(M.settings.pact)} · fin de run`, `étoiles <b>${esc(M.settings.stars)}</b>`,
    final ? `${M.settings.floors} étages · boss final <b>${nf.format(final.boss)} PV</b>` : '', `${big(M.roomsSimulated)} salles simulées`].filter(Boolean).map((c) => `<span class="chip">${c}</span>`).join('');
  $('#foot').innerHTML = `<span>Analyse du ${new Date(M.generatedAt).toLocaleString('fr-FR')} · simulateur officiel du banc d’essai (play.runejack.com/banc), exécuté tel quel. Réglages : ${esc(M.settings.pact)}, bot du jeu, sans contrat, ${esc(M.settings.stars)}.</span><span>Les objets du Contrebandier sont exclus des compos ; ils apparaissent comme améliorations possibles.</span>`;
  $('#tabs').innerHTML = TABS.map(([id, label]) => `<button role="tab" data-tab="${id}" aria-selected="false">${label}</button>`).join('');
  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) show(b.dataset.tab); });
  const start = TABS.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : 'compos';
  show(start);
  addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.some(([id]) => id === t)) show(t); });
}
function show(tab) {
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const v = $('#view');
  v.innerHTML = `<section class="view" role="tabpanel">${VIEWS[tab]()}</section>`;
  AFTER[tab]?.(v);
  try { history.replaceState(null, '', `#${tab}`); } catch {}
}

const unitHtml = (h, role) => `<span class="unit"><span class="st">${'★'.repeat(h.star ?? 2)}</span>${tileOf(h.id, '', role)}<span class="its">${(h.items ?? []).map((it) => itemIcon(it)).join('')}</span><span class="n">${esc(hero(h.id).name)}</span></span>`;
function heroCardHtml(h, role) {
  const tag = role === 'carry' ? '<span class="carry-tag">CARRY</span>' : role === 'key' ? '<span class="key-tag">CLÉ</span>' : '';
  return `<div class="hcard${role ? ` ${role}` : ''}"><div class="top"><span class="who">${tileOf(h.id, 'xs')}<b>${esc(hero(h.id).name)} <span class="st">${'★'.repeat(h.star ?? 2)}</span></b></span>${tag}</div>
    ${h.damageShare != null ? `<span class="d">${pct(h.damageShare)} des dégâts</span>` : ''}
    ${(h.items ?? []).map((it) => `<span class="itrow">${itemIcon(it, 'icon md')}${esc(itemName(it))}</span>`).join('') || '<span class="it muted">sans objet</span>'}</div>`;
}
const famChips = (fams) => Object.entries(fams).sort((a, b) => b[1] - a[1]).map(([f, k]) => `<span class="fam ${f}">${esc(FAM.get(f)?.name ?? f)} ${k}</span>`).join('');
// interest per room won: essence by steps of 5 gold up to 1.x, gold by tiers since 3.0
const interestOf = (g) => {
  const e = M.economy ?? {};
  if (!e.interestTiers) return { n: Math.floor(g / (e.interestStep ?? 5)), unit: 'essence' };
  let n = 0, prev = 0;
  for (const { upTo, step } of e.interestTiers) { const span = Math.min(g, upTo ?? Infinity) - prev; if (span <= 0) break; n += Math.floor(span / step); prev = upTo; }
  return { n, unit: 'or' };
};
const interestRule = () => {
  const e = M.economy ?? {};
  if (!e.interestTiers) return `chaque tranche de ${e.interestStep ?? 5} or gardés rapporte 1 essence d’intérêts par salle gagnée`;
  let prev = 0;
  return 'intérêts en or par salle gagnée : ' + e.interestTiers.map(({ upTo, step }) => { const t = upTo == null || upTo === Infinity ? `1 par tranche de ${step} au-delà de ${prev}` : `1 par tranche de ${step} jusqu’à ${upTo}`; prev = upTo; return t; }).join(', ');
};
function boardsHtml(c) {

    <p class="muted" style="font-size:13px;margin-top:8px">Pour chaque nombre de sièges, les héros de la compo à poser en premier (meilleur sous-ensemble mesuré sur le banc, avec leurs objets, en milieu de run).${M.firstPicks ? ` Premier héros, avant la compo : le plus fort seul à 1★ (${M.firstPicks.slice(0, 5).map((x) => esc(hero(x.id).name)).join(', ')}).` : ''}</p>`;
}

      ${c.contraband ? `<div class="sect" style="margin-top:14px"><h4>Si le Contrebandier passe</h4><ul class="tips">${c.contraband.slice(0, 3).map((x) => `<li>${itemIcon(x.item, 'icon md')} <b>${esc(itemName(x.item))}</b> sur ${esc(hero(x.hero).name)}${x.replaces ? ` à la place de ${esc(itemName(x.replaces))}` : ''} : ${sgn(x.gain)}</li>`).join('')}</ul></div>` : ''}
    </div>

      ${c.blessings ? `<div class="sect" style="margin-top:14px"><h4>Bénédictions</h4><ul class="tips">${c.blessings.slice(0, 4).map((b) => `<li><b>${esc(BL.get(b.id)?.name ?? b.id)}</b> ${sgn(b.gain)}</li>`).join('')}</ul></div>` : ''}

function strategy() {
  const F = M.settings.floors, e = M.economy, hp = M.hp?.[1] ?? [];
  const top = M.comps[0], alt = M.comps.find((c) => !c.heroes.some((h) => h.id === M.pivot)) ?? M.comps[1];
  const early = M.comps.filter((c) => c.cheap).slice(0, 2);
  const op = (M.openers ?? []).filter((o) => o.seats === 3).slice(0, 3);
  const bossHp = (k) => hp.find((x) => x.etage === k)?.boss;
  const keyItems = [...new Set(top.heroes.flatMap((h) => h.items))];
  const piv = hero(M.pivot).name;
  return `<p class="muted">Le déroulé d’une run au ${esc(M.settings.pact)}, étage par étage, construit à partir des mesures de cette version. PV des boss : ${hp.slice(0, F + 1).map((x) => `${x.etage} : ${nf.format(x.boss)}`).join(' · ')}.</p>
  <ol class="steps">
    <li><div><h3>Départ · étages 1 et 2</h3><ul class="tips" style="margin-top:8px">
      <li>Tu commences avec <b>${e.startGold} or</b>${e.startEssence != null ? ` et <b>${e.startEssence} essence</b>` : ''}, et une invocation offerte. <b>Une salle perdue termine la run</b> : les boss font ${nf.format(bossHp(1) ?? 0)} puis ${nf.format(bossHp(2) ?? 0)} PV.</li>
      ${M.firstPicks ? `<li><b>Premier héros</b> (invocation offerte) : garde le plus fort seul à 1★ : ${M.firstPicks.slice(0, 6).map((x) => `<b>${esc(hero(x.id).name)}</b>`).join(', ')}. Un seul siège au départ : c’est lui qui doit gagner les trois premières salles.</li>` : ''}
      <li><b>Remplis les sièges</b> avant d’acheter de l’XP (${e.xpCost} or pour ${e.xpGain} XP).</li>
      <li>Joue <b>blackjack classique</b> : reste à 17, double 10-11 contre 2 à 9, défausse une carte basse sur 12-16.</li>
      ${op.length ? `<li>Débuts les plus solides, héros de coût 1-2 sans objet, 3 sièges : ${op.map((o) => `<b>${esc(FAM.get(o.family)?.name ?? o.family)}</b> (${o.heroes.map((h) => esc(hero(h).name)).join(', ')}) : boss de l’étage 3 battu ${pct(o.kill[3] ?? 0)}`).join(' ; ')}.</li>` : ''}
      <li>Garde de l’or : ${interestRule()}.</li>
    </ul></div></li>
    <li><div><h3>Construire · étages 3 à 5</h3><ul class="tips" style="margin-top:8px">
      <li>Vise un palier 4 de famille (4 héros) : ${early.length ? early.map((c) => `<b>${esc(c.name)}</b> (${big(c.milieu.median)} par salle en milieu de run)`).join(', ') : 'un Banco de la tier list'}.</li>
      <li>À l’étal (${e.itemPrice} or, ${e.itemPriceFamily} pour emblèmes et Sceau royal), achète en priorité les objets de la compo finale : <b>${keyItems.map((i) => esc(itemName(i))).join(', ')}</b>.</li>
      <li>Garde sur le banc (${e.benchSize} places) les copies des héros clés : <b>${top.heroes.map((h) => esc(hero(h.id).name)).join(', ')}</b>. Trois copies identiques fusionnent.</li>
      <li>Le pivot de la meilleure compo est <b>${esc(piv)}</b> : dès que tu l’as à ${hero(M.pivot).solo?.star ?? 2}★, construis autour.</li>
    </ul></div></li>
    <li><div><h3>Finaliser · étages ${F - 1} et ${F}</h3><ul class="tips" style="margin-top:8px">
      <li>Compo cible : <b>${esc(top.name)}</b> (${top.heroes.map((h) => esc(hero(h.id).name)).join(' · ')}), ${big(top.fin.median)} par salle, boss final battu ${pct(top.fin.kill[F] ?? 0)}.</li>
      <li>Sans ${esc(piv)} : <b>${esc(alt.name)}</b> (${big(alt.fin.median)}).</li>
      ${top.runes ? `<li>Runes, de gauche à droite : <b>${top.runes.build.map((r) => esc(RU.get(r)?.name ?? r)).join(' → ')}</b>.</li>` : ''}
      ${top.blessings ? `<li>Bénédiction à prendre : <b>${esc(BL.get(top.blessings[0].id)?.name)}</b> (${sgn(top.blessings[0].gain)}).</li>` : ''}
      <li>Regarde le boss annoncé avant la grande salle : contre <b>${esc(BO.get([...top.bosses].sort((a, b) => a.ratio - b.ratio)[0].id)?.name)}</b>, ta compo tombe à ${pct([...top.bosses].sort((a, b) => a.ratio - b.ratio)[0].ratio)} de ses dégâts.</li>
    </ul></div></li>
    <li><div><h3>Le Fond · étage ${F + 1} et au-delà</h3><ul class="tips" style="margin-top:8px">
      <li>Les PV explosent : ${hp.filter((x) => x.etage > F).slice(0, 3).map((x) => `${x.etage} : ${big(x.boss)}`).join(' · ')}.</li>
      <li>Grave les âmes sur ton porteur principal : chaque âme double ses dégâts.</li>
      <li>Les compos qui tiennent le plus loin : ${M.comps.slice(0, 3).map((c) => `<b>${esc(c.name)}</b> (étage ${(c.fin.tenu ?? 0).toLocaleString('fr-FR', { maximumFractionDigits: 1 })})`).join(', ')}.</li>
    </ul></div></li>
  </ol>`;
}
function runes() {
  const withR = M.comps.filter((c) => c.runes);
  if (!withR.length) return '<div class="empty">Pas encore de mesure des runes.</div>';
  return `<div class="grid2">${withR.map((c) => `<div class="card"><h3>${esc(c.name)}</h3>
    <p class="muted">Build de 6 runes sans rune secrète (gauche → droite) : ×${(1 + c.runes.buildGain).toLocaleString('fr-FR', { maximumFractionDigits: 1 })}</p>
    <ol style="margin:0;padding-left:20px">${c.runes.build.map((r) => `<li><span class="who" style="display:inline-flex">${runeIcon(r, 'icon md')}<b>${esc(RU.get(r)?.name)}</b></span> <span class="muted">${esc(RU.get(r)?.desc)}</span></li>`).join('')}</ol>
    <h3 style="font-size:20px">Une rune seule</h3><div class="tbl"><table><tbody>${c.runes.single.slice(0, 10).map((x) => `<tr><td>${esc(RU.get(x.id)?.name)}${RU.get(x.id)?.rarity === 'secrete' ? ' <span class="tag grey">secrète</span>' : ''}</td><td class="n">${sgn(x.gain)}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted">À éviter : ${c.runes.worst.slice(-3).map((x) => `${esc(RU.get(x.id)?.name)} (${sgn(x.gain)})`).join(', ')}</p></div>`).join('')}</div>
    <div class="card"><h3>Toutes les runes</h3><div class="tbl"><table><thead><tr><th>Rune</th><th>Rareté</th><th>Effet</th></tr></thead><tbody>${M.runes.map((r) => `<tr><td><span class="who">${runeIcon(r.id, 'icon md')}<b>${esc(r.name)}</b></span></td><td>${esc(r.rarity)}</td><td>${esc(r.desc)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function blessings() {
  const cs = M.comps.filter((c) => c.blessings).slice(0, 4);
  return `<p class="muted">Une bénédiction au choix parmi trois après le boss des étages 3, 6, 9… Gain sur la médiane des dégâts par salle.</p>
  <div class="tbl"><table><thead><tr><th>Bénédiction</th><th>Effet</th>${cs.map((c) => `<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${M.blessings.map((b) => `<tr><td><b>${esc(b.name)}</b>${b.fromAnte ? ` <span class="tag grey">dès l’étage ${b.fromAnte}</span>` : ''}</td><td>${esc(b.desc)}</td>${cs.map((c) => { const g = c.blessings.find((x) => x.id === b.id)?.gain ?? 0; return `<td class="n"><span class="pill ${g > 0.3 ? 'good' : g > 0.05 ? 'warn' : 'bad'}">${sgn(g)}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function contraband() {
  const e = M.economy;
  const items = M.items.filter((i) => i.contraband);
  return `<div class="card"><p>Le Contrebandier passe dans ${pct(e.traderChance ?? 0.13)} des boutiques à partir de l’étage ${e.traderFromAnte ?? 2}, ${e.traderVisits ?? 2} fois au plus par run, et ne laisse prendre qu’un objet. Les compos de la tier list n’en dépendent jamais : voici quoi prendre s’il passe.</p></div>
  <div class="tbl"><table><thead><tr><th>Objet</th><th>Prix</th><th>Effet</th><th>Meilleurs porteurs (héros seul)</th></tr></thead><tbody>${items.map((i) => `<tr><td><b class="contra" style="color:var(--contra)">${esc(i.name)}</b></td><td class="n">${i.price} or</td><td>${esc(i.desc)}</td><td>${i.bestFor.slice(0, 3).map((x) => `${esc(hero(x.hero).name)} ${sgn(x.gain)}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>
  <div class="grid2">${M.comps.filter((c) => c.contraband).map((c) => `<div class="card"><h3>${esc(c.name)}</h3><ul class="tips">${c.contraband.map((x) => `<li><b>${esc(itemName(x.item))}</b> sur ${esc(hero(x.hero).name)}${x.replaces ? `, à la place de ${esc(itemName(x.replaces))}` : ''} : <span class="good">${sgn(x.gain)}</span></li>`).join('')}</ul></div>`).join('')}</div>`;
}
function bosses() {
  const cs = M.comps.slice(0, 6);
  return `<p class="muted">Dégâts contre chaque boss en % d’une salle normale (même compo). Vert : peu gêné ; rouge : contre.</p>
  <div class="tbl"><table><thead><tr><th>Boss</th><th>Vice</th><th>Règle</th>${cs.map((c) => `<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${M.bosses.map((b) => `<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.vice)}</td><td>${esc(b.desc)}</td>${cs.map((c) => { const x = c.bosses.find((y) => y.id === b.id); return `<td>${x ? pillPct(x.ratio) : '–'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>PV par étage (${esc(M.settings.pact)})</h3><div class="tbl"><table><thead><tr><th>Étage</th><th>Vice</th><th>Petite salle</th><th>Grande salle</th><th>Boss</th></tr></thead><tbody>${(M.hp?.[1] ?? []).slice(0, M.settings.floors + 4).map((x) => `<tr><td class="n">${x.etage}</td><td>${esc(x.vice)}</td><td class="n">${big(x.petite)}</td><td class="n">${big(x.grande)}</td><td class="n">${big(x.boss)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function realGames() {
  if (!S?.ok) return `<div class="empty">Pas de statistiques des vraies parties pour l’instant. Elles viennent de l’API du jeu et demandent une clé (play.runejack.com/admin, onglet Clés API), ajoutée aux secrets de l’environnement de mise à jour.</div>`;
  const r = S.routes;
  const tbl = (head, rows) => `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const bar = (x) => `<div class="who"><div class="track"><div class="minibar" style="width:${Math.max(0, Math.min(100, x ?? 0))}%"></div></div>${rate(x)}</div>`;
  const runs = r.objets?.runsSuivies ?? r.benedictions?.runsSuivies;
  const heroes = Array.isArray(r.heros) ? [...r.heros].sort((a, b) => b.tauxPresence - a.tauxPresence) : [];
  const items = r.objets?.objets ? [...r.objets.objets, ...(r.objets.emblemes ?? [])].sort((a, b) => b.tauxPresence - a.tauxPresence) : [];
  const runes = Array.isArray(r.runes) ? [...r.runes].sort((a, b) => b.tauxPresence - a.tauxPresence) : [];
  const bless = r.benedictions?.benedictions ? [...r.benedictions.benedictions].sort((a, b) => b.tauxPresence - a.tauxPresence) : [];
  const pactName = (n) => M.pacts.find((p) => p.level === n)?.name ?? n;
  return `<div class="card"><p>Ce que font les joueurs, d’après l’API du jeu (lue le ${new Date(S.fetchedAt).toLocaleString('fr-FR')}${runs ? `, ${runs} runs suivies` : ''}). Les petits échantillons bougent beaucoup : le nombre de runs est entre parenthèses. À comparer avec les mesures du banc dans les autres onglets.</p></div>
  ${r.salles?.etages ? `<div class="card"><h3>Survie par étage</h3>${tbl(['Étage', 'Runs arrivées', 'Défaites', 'Survie'], r.salles.etages.slice(0, 12).map((e) => `<tr><td class="n">${e.etage}</td><td class="n">${e.atteint}</td><td class="n">${e.defaites}</td><td>${bar(e.tauxSurvie)}</td></tr>`))}</div>` : ''}
  <div class="grid2">
    ${r.decks?.maledictions ? `<div class="card"><h3>Pactes</h3>${tbl(['Pacte', 'Runs', 'Victoire', 'Étage moyen'], r.decks.maledictions.map((x) => `<tr><td>${esc(pactName(x.niveau))}</td><td class="n">${x.runs}</td><td>${bar(x.tauxVictoire)}</td><td class="n">${x.etageMoyen}</td></tr>`))}</div>` : ''}
    ${r.decks?.decks ? `<div class="card"><h3>Contrats</h3>${tbl(['Contrat', 'Runs', 'Victoire', 'Étage moyen'], r.decks.decks.map((x) => `<tr><td>${esc(x.nom)}</td><td class="n">${x.runs}</td><td>${bar(x.tauxVictoire)}</td><td class="n">${x.etageMoyen}</td></tr>`))}</div>` : ''}
  </div>
  ${heroes.length ? `<div class="card"><h3>Héros</h3>${tbl(['Héros', 'Joué', 'Victoire', 'Étage moyen', 'Étoiles moy.', 'Tirages gagnés'], heroes.map((x) => `<tr><td><div class="who">${H.has(x.id) ? hexOf(x.id, true) : ''}<b>${esc(x.nom)}</b></div></td><td>${bar(x.tauxPresence)}</td><td class="n">${rate(x.tauxVictoire)} <span class="muted">(${x.runs})</span></td><td class="n">${x.etageMoyen}</td><td class="n">${x.etoilesMoyennes}</td><td class="n">${rate(x.tauxTirage)}</td></tr>`))}</div>` : ''}
  <div class="grid2">
    ${items.length ? `<div class="card"><h3>Objets</h3>${tbl(['Objet', 'Joué', 'Victoire', 'Étage moyen'], items.slice(0, 25).map((x) => `<tr><td><b>${esc(x.nom)}</b></td><td>${bar(x.tauxPresence)}</td><td class="n">${rate(x.tauxVictoire)} <span class="muted">(${x.runs})</span></td><td class="n">${x.etageMoyen}</td></tr>`))}</div>` : ''}
    ${runes.length ? `<div class="card"><h3>Runes</h3>${tbl(['Rune', 'Jouée', 'Victoire'], runes.slice(0, 25).map((x) => `<tr><td><b>${esc(x.nom)}</b></td><td>${bar(x.tauxPresence)}</td><td class="n">${rate(x.tauxVictoire)} <span class="muted">(${x.runs})</span></td></tr>`))}</div>` : ''}
  </div>
  ${bless.length ? `<div class="card"><h3>Bénédictions</h3>${tbl(['Bénédiction', 'Prise', 'Victoire', 'Étage moyen'], bless.map((x) => `<tr><td><b>${esc(x.nom)}</b></td><td>${bar(x.tauxPresence)}</td><td class="n">${rate(x.tauxVictoire)} <span class="muted">(${x.runs})</span></td><td class="n">${x.etageMoyen}</td></tr>`))}</div>` : ''}`;
}
function patch() {
  const ch = M.changes;
  const list = (t, a) => (a?.length ? `<li><b>${t}</b> : ${a.map(esc).join(', ')}</li>` : '');
  return `<div class="grid2"><div class="card"><h3>Version ${esc(M.version)}</h3><p class="muted">${esc(M.versionDate ?? '')} · ${esc(M.versionTitle ?? '')}</p>
    ${ch ? `<p>Depuis la version analysée précédente (${esc(M.previousVersion)}) :</p><ul class="tips">${list('Héros ajoutés', ch.heroes.added)}${list('Héros retirés', ch.heroes.removed)}${list('Effets de héros modifiés', ch.heroText)}${list('Objets ajoutés', ch.items.added)}${list('Objets retirés', ch.items.removed)}${list('Runes ajoutées', ch.runes.added)}${list('Bénédictions ajoutées', ch.blessings.added)}</ul>` : '<p class="muted">Première analyse.</p>'}
    <p class="muted">Analyse : ${(M.minutes ?? 0).toLocaleString('fr-FR', { maximumFractionDigits: 0 })} min, ${big(M.roomsSimulated)} salles simulées.</p></div>
    <div class="card"><h3>Notes de patch</h3><pre class="notes">${esc(M.patchNotes ?? '')}</pre></div></div>`;
}
load();
</script>
